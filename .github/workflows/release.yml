name: Release

# npm trusts this workflow file (trusted publishing), so publishing needs no token and attaches
# provenance. Changesets opens a "Version packages" pull request from pending changesets and
# publishes once that pull request is merged.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          title: Version packages
          commit: Version packages
          version: bun changeset version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
